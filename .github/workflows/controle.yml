# Contrôle automatique à chaque modification : reconstruit les données du site à
# partir des CSV et vérifie que les fichiers publiés sont bien à jour.
name: Contrôle

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reconstruire les données du site (contrôles de cohérence inclus)
        run: python3 outils/construire_donnees.py

      - name: Reconstruire les images de partage (leurs textes sont repris dans les pages)
        run: |
          pip install pillow
          python3 outils/images_partage.py

      - name: Vérifier que donnees/site/, les pages et le plan du site correspondent aux CSV
        run: |
          if ! git diff --exit-code --stat -- donnees/site '*.html' sitemap.xml robots.txt; then
            echo "::error::Les fichiers de donnees/site/, les chiffres des pages HTML ou le plan du site (sitemap.xml) ne sont pas à jour. Lancez « python3 outils/construire_donnees.py » et validez le résultat."
            git diff -- donnees/site '*.html' sitemap.xml robots.txt | head -c 4000
            exit 1
          fi
          if [ -n "$(git status --porcelain -- donnees/site sitemap.xml robots.txt)" ]; then
            echo "::error::La construction a créé des fichiers non suivis (donnees/site/, sitemap.xml ou robots.txt)."
            git status --porcelain -- donnees/site sitemap.xml robots.txt
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Vérifier la syntaxe des scripts JavaScript
        run: |
          for f in assets/js/*.js donnees/site/*.js; do
            node --check "$f"
          done

      - name: Installer les outils de test (axe-core, Playwright et Chromium)
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Test d'accessibilité (axe-core, WCAG 2.2 A et AA)
        run: npm run test:accessibilite
